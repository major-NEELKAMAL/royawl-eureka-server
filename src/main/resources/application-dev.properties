spring.application.name=royawl-eureka-server

server.port=8761

# Basic auth for dashboard and /eureka/** API; clients put the same credentials in defaultZone
spring.security.user.name=${EUREKA_USERNAME:eureka}
spring.security.user.password=${EUREKA_PASSWORD:eureka}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# For local development
eureka.server.enable-self-preservation=false
#eureka.instance.hostname=localhost
eureka.instance.hostname=192.168.1.8
